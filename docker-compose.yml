services:
  mqtt-init:
    image: eclipse-mosquitto:2
    restart: "no"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        if [ -f /mosquitto/data/passwordfile ]; then
          mosquitto_passwd -b /mosquitto/data/passwordfile "$$MQTT_USERNAME" "$$MQTT_PASSWORD"
        else
          mosquitto_passwd -b -c /mosquitto/data/passwordfile "$$MQTT_USERNAME" "$$MQTT_PASSWORD"
        fi
        chmod 600 /mosquitto/data/passwordfile
    environment:
      MQTT_USERNAME: ${MQTT_USERNAME:?Set MQTT_USERNAME in Dokploy environment}
      MQTT_PASSWORD: ${MQTT_PASSWORD:?Set MQTT_PASSWORD in Dokploy environment}
    volumes:
      - mqtt-data:/mosquitto/data

  mqtt:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    depends_on:
      mqtt-init:
        condition: service_completed_successfully
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mqtt-data:/mosquitto/data
      - mqtt-log:/mosquitto/log
    ports:
      - "${MQTT_BIND_ADDRESS:-0.0.0.0}:1883:1883"

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:?Set DB_NAME in .env}
      MYSQL_USER: ${DB_USER:?Set DB_USER in .env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
    expose:
      - "3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  web:
    build: .
    restart: unless-stopped
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in Dokploy environment}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?Set DJANGO_ALLOWED_HOSTS in Dokploy environment}
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:?Set DB_NAME in Dokploy environment}
      DB_USER: ${DB_USER:?Set DB_USER in Dokploy environment}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in Dokploy environment}
    depends_on:
      db:
        condition: service_healthy
      mqtt:
        condition: service_started
    expose:
      - "8000"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - static-data:/app/staticfiles
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1',8000),2); s.close()"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

  mqtt-worker:
    build: .
    restart: unless-stopped
    command: ["python", "manage.py", "mqtt_listener"]
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:?Set DB_NAME in Dokploy environment}
      DB_USER: ${DB_USER:?Set DB_USER in Dokploy environment}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in Dokploy environment}
      MQTT_HOST: mqtt
      MQTT_PORT: ${MQTT_PORT:-1883}
      MQTT_USERNAME: ${MQTT_USERNAME:?Set MQTT_USERNAME in Dokploy environment}
      MQTT_PASSWORD: ${MQTT_PASSWORD:?Set MQTT_PASSWORD in Dokploy environment}
    depends_on:
      db:
        condition: service_healthy
      mqtt:
        condition: service_started
      web:
        condition: service_healthy

volumes:
  mysql-data:
  static-data:
  mqtt-data:
  mqtt-log:
